name: CI

# Checks every pull request and every push to main: the package installs from
# the lockfile, the vendored Lucide icons match
# src/icons/lucide.json, it typechecks, builds, passes the node:test suite against
# dist/, and ships the files we expect.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build, pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/icons/svg/*.svg, generated.ts and LICENSE-lucide.txt must match
      # src/icons/lucide.json and the pinned lucide-static devDependency.
      - name: Icons up to date
        run: pnpm icons --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # node:test without extra dependencies, against the built dist/.
      - name: Test
        run: pnpm test

      # Lists exactly what `npm publish` would upload, so a missing or stray
      # file shows up in the PR rather than on npm.
      - name: Pack (dry run)
        run: npm pack --dry-run
